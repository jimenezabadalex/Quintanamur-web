name: Weekly ELT Pipeline (Neon to BigQuery)

on:
  schedule:
    # Se ejecuta todos los viernes a las 22:00 UTC (23:00 CET en invierno / 00:00 CEST en verano)
    - cron: '0 22 * * 5'
  workflow_dispatch: # Permite ejecutar el pipeline manualmente desde la pestaña "Actions" en GitHub

jobs:
  run-elt:
    name: Sincronizar Neon PostgreSQL con Google BigQuery
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependencias del Pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔐 Reconstruir credenciales seguras de Google Cloud
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::El secreto GCP_SA_KEY no está configurado en GitHub Secrets."
            exit 1
          fi
          echo "$GCP_SA_KEY" > gcp-key.json
          chmod 600 gcp-key.json

      - name: 🚜 Ejecutar Pipeline ELT (Extracción, Carga y Star Schema)
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          GCP_KEY_PATH: "gcp-key.json"
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'quintanamur-analytics' }}
          BIGQUERY_DATASET_ID: ${{ vars.BIGQUERY_DATASET_ID || 'quintanamur_warehouse' }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "::error::El secreto NEON_DATABASE_URL no está configurado en GitHub Secrets."
            exit 1
          fi
          python scripts/elt_pipeline.py

      - name: 🧹 Limpieza de credenciales efímeras
        if: always()
        run: |
          rm -f gcp-key.json

      - name: 🚨 CRIT-03 — Notificar fallo en pipeline a Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TIMESTAMP=$(TZ='Europe/Madrid' date '+%d/%m/%Y %H:%M:%S')
          MESSAGE="⚠️ <b>[FALLO EN PIPELINE BIGQUERY]</b> ⚠️%0A━━━━━━━━━━━━━━━━━━━━━━━━━━%0A⚙️ <b>Workflow:</b> Weekly ELT Pipeline (Neon → BigQuery)%0A⏰ <b>Hora:</b> ${TIMESTAMP} (Europe/Madrid)%0A❌ <b>Estado:</b> El pipeline ha fallado antes de completarse.%0A━━━━━━━━━━━━━━━━━━━━━━━━━━%0A🔍 <b>DIAGNÓSTICO:</b>%0ARevisa el log completo de GitHub Actions para identificar la causa (credencial caducada, cuota de BigQuery, error en el script ELT, etc.)%0A━━━━━━━━━━━━━━━━━━━━━━━━━━%0A🔗 <b>Ver log y reejecutar en GitHub:</b>%0A${RUN_URL}"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"${MESSAGE}\",\"parse_mode\":\"HTML\",\"disable_web_page_preview\":false}" \
            > /dev/null
